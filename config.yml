## internship finder settings (edit freely, the pi pulls changes every run)

## what counts as a match
search:
  term: {season: summer, year: 2027}
  # sectors or companies here get a small ranking boost (notable or exciting)
  bigCities: [chicago, houston, austin, dallas, fort worth, plano, seattle, redmond, kent, bellevue,
              los angeles, hawthorne, el segundo, long beach, torrance, irvine, san diego,
              san francisco, bay area, san jose, sunnyvale, mountain view, palo alto, fremont, oakland,
              boston, cambridge, new york, brooklyn, denver, boulder, atlanta, washington, arlington,
              phoenix, minneapolis, detroit, pittsburgh, philadelphia, miami, orlando]

## alerts (ntfy topic lives in ~/.config/internship-finder/env on the pi, never in this repo)
alerts:
  maxPerRun: 5        # more new matches than this in one run get batched into one summary ping
  minScore: 30        # matches scoring below this show on the dashboard but don't ping
  dashboardUrl: https://db165.github.io/internship-finder/

## crawling manners
schedule:
  runEveryMinutes: 60   # the pi timer
  defaultEveryRuns: 1   # every company is checked every run (hourly); raise to 2 to stagger
  priorityEveryRuns: 1  # companies marked priority: true are checked every run
http:
  perHostDelaySeconds: 1.5
  timeoutSeconds: 25
  workers: 1           # a pi 3 can't parse several big boards at once without swapping
  maxDetailFetchesPerRun: 150   # full descriptions are fetched once per new posting, then cached
workday:
  maxPages: 8             # 20 postings per page
  keywordPages: 2         # extra keyword pass in case a posting isn't tagged as an intern
  queries: [internship, co-op]
dropClosedAfterDays: 14

